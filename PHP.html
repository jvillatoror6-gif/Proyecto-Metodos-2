<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>Calculadora Metodo Simplex y Grafico</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <div class="contenedor">

        <h1>Calculadora de Programación Lineal</h1>

        <p>
            Seleccione el método que desea utilizar:
        </p>

            <button onclick="mostrarSimplex()">
                Método Simplex
            </button>

           <button onclick="mostrarGrafico()">
                Método Gráfico
            </button>

            <button onclick="mostrarCostoMinimo()">
                Costo Minimo
            </button>

        </div>

        <div id="contenido"></div>

    </div>

    <script src="Simplex.js"></script>
    <script src="metodo_grafico.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="costo_minimo.js"></script>


</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de Programación Lineal</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <div class="contenedor">

        <h1>Calculadora de Programación Lineal</h1>

        <p class="descripcion">
            Selecciona el método que deseas utilizar
        </p>

        <div class="botones">
            <button onclick="mostrarSimplex()">
                Método Simplex
            </button>

            <button onclick="mostrarGrafico()">
                Método Gráfico
            </button>
        </div>

        <div id="contenido"></div>

    </div>

    <script src="calculadora.js"></script>

</body>
</html>
